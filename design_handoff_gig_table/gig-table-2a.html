document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   <span sc-camel-on-click=\"{{ stop }}\">\n                    <sc-if value=\"{{ r.share.show }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button sc-camel-on-click=\"{{ r.share.onClick }}\" title=\"{{ r.share.label }}\" style=\"height:30px;padding:0 9px;border-radius:7px;border:1px solid #E5E7EB;background:#FFFFFF;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:#0F1115;\" style-hover=\"border-color:#9AA0AA;\">\n                        <sc-if value=\"{{ r.share.isPriv }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 512 512\" style=\"height:12px;width:12px;fill:currentColor;\"><path d=\"M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48L48 64zM0 176L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-208L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                        <sc-if value=\"{{ r.share.isPublic }}\" hint-placeholder-val=\"{{ true }}\"><svg sc-camel-view-box=\"0 0 640 512\" style=\"height:12px;width:15px;fill:currentColor;\"><path d=\"M580.3 267.2c56.2-56.2 56.2-147.3 0-203.5C526.8 10.2 440.9 7.3 383.9 57.2l-6.1 5.4c-10 8.7-11 23.9-2.3 33.9s23.9 11 33.9 2.3l6.1-5.4c38-33.2 95.2-31.3 130.9 4.4c37.4 37.4 37.4 98.1 0 135.6L433.1 346.6c-37.4 37.4-98.2 37.4-135.6 0c-35.7-35.7-37.6-92.9-4.4-130.9l4.7-5.4c8.7-10 7.7-25.1-2.3-33.9s-25.1-7.7-33.9 2.3l-4.7 5.4c-49.8 57-46.9 142.9 6.6 196.4c56.2 56.2 147.3 56.2 203.5 0L580.3 267.2zM59.7 244.8C3.5 301 3.5 392.1 59.7 448.2c53.6 53.6 139.5 56.4 196.5 6.5l6.1-5.4c10-8.7 11-23.9 2.3-33.9s-23.9-11-33.9-2.3l-6.1 5.4c-38 33.2-95.2 31.3-130.9-4.4c-37.4-37.4-37.4-98.1 0-135.6L207 165.4c37.4-37.4 98.1-37.4 135.6 0c35.7 35.7 37.6 92.9 4.4 130.9l-5.4 6.1c-8.7 10-7.7 25.1 2.3 33.9s25.1 7.7 33.9-2.3l5.4-6.1c49.9-57 47-142.9-6.5-196.5c-56.2-56.2-147.3-56.2-203.5 0L59.7 244.8z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                        {{ r.share.short }}\n                      <\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ r.share.hide }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#9AA0AA;\">—<\u002Fspan><\u002Fsc-if>\n                  <\u002Fspan>\n                  <button sc-camel-on-click=\"{{ stop }}\" style=\"width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#6B7280;\" style-hover=\"background:#F3F4F6;color:#0F1115;\">\n                    <svg sc-camel-view-box=\"0 0 448 512\" style=\"height:13px;width:13px;fill:currentColor;\"><path d=\"M8 256a56 56 0 1 1 112 0A56 56 0 1 1 8 256zm160 0a56 56 0 1 1 112 0 56 56 0 1 1 -112 0zm216-56a56 56 0 1 1 0 112 56 56 0 1 1 0-112z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ bTogglePast }}\" style=\"width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:13.5px;font-weight:500;color:#4B5160;background:#FAFBFC;\" style-hover=\"color:#0F1115;\">\n                <svg sc-camel-view-box=\"0 0 320 512\" style=\"height:10px;width:7px;fill:currentColor;transform:{{ bPastRot }};transition:transform 150ms;\"><path d=\"M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z\"><\u002Fpath><\u002Fsvg>\n                Past gigs\n                <span style=\"font-family:'Geist Mono', monospace;font-size:12px;color:#6B7280;\">{{ pastCount }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ bShowPast }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ bPast }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:44px 124px 108px minmax(0,1fr) 124px 132px 96px 168px 104px 40px;align-items:center;height:48px;border-top:1px solid #F0F1F3;font-size:14px;color:#6B7280;background:#FFFFFF;\">\n                    <span><\u002Fspan>\n                    <span style=\"font-family:'Geist Mono', monospace;font-size:13px;\">{{ r.dateMono }}<\u002Fspan>\n                    <span style=\"font-family:'Geist Mono', monospace;font-size:13px;\">{{ r.time }}<\u002Fspan>\n                    <span>{{ r.name }}<\u002Fspan>\n                    <span style=\"font-size:13px;\">{{ r.artist }}<\u002Fspan>\n                    <span style=\"font-family:'Geist Mono', monospace;font-size:14px;\">{{ r.apps }}<\u002Fspan>\n                    <span><\u002Fspan>\n                    <span><span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 8px;border-radius:6px;background:{{ r.st.bg }};color:{{ r.st.color }};\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ r.st.dot }};\"><\u002Fspan>{{ r.st.label }}<\u002Fspan><\u002Fspan>\n                    <span><\u002Fspan><span><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ bHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#111317;color:#FFFFFF;border-radius:12px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,0.25);font-family:'Geist', sans-serif;\">\n            <span style=\"font-size:14px;font-weight:500;margin-right:10px;\">{{ bSelLabel }}<\u002Fspan>\n            <button style=\"padding:7px 12px;border-radius:8px;font-size:13.5px;color:#E5E7EB;\" style-hover=\"background:#2A2E36;color:#FFFFFF;\">Duplicate<\u002Fbutton>\n            <button style=\"padding:7px 12px;border-radius:8px;font-size:13.5px;color:#E5E7EB;\" style-hover=\"background:#2A2E36;color:#FFFFFF;\">Make template<\u002Fbutton>\n            <button style=\"padding:7px 12px;border-radius:8px;font-size:13.5px;color:#E5E7EB;\" style-hover=\"background:#2A2E36;color:#FFFFFF;\">Set invite only<\u002Fbutton>\n            <button style=\"padding:7px 12px;border-radius:8px;font-size:13.5px;color:#FF9C85;\" style-hover=\"background:#2A2E36;\">Delete<\u002Fbutton>\n            <span style=\"width:1px;height:20px;background:#2F333B;margin:0 4px;\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ bClearSel }}\" style=\"width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9AA0AA;\" style-hover=\"background:#2A2E36;color:#FFFFFF;\">\n              <svg sc-camel-view-box=\"0 0 384 512\" style=\"height:13px;width:10px;fill:currentColor;\"><path d=\"M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPast&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}}\">\nconst ST = {\n  confirmed:   { label: 'Confirmed',             dot: 'oklch(0.66 0.14 150)', color: 'oklch(0.45 0.11 150)', bg: 'oklch(0.95 0.04 150)' },\n  awaiting:    { label: 'Awaiting payment',      dot: 'oklch(0.72 0.15 70)',  color: 'oklch(0.48 0.11 60)',  bg: 'oklch(0.95 0.05 80)' },\n  negotiating: { label: 'Negotiating',           dot: 'oklch(0.62 0.13 260)', color: 'oklch(0.45 0.12 260)', bg: 'oklch(0.95 0.03 260)' },\n  open:        { label: 'Open for applications', dot: '#B8AFA6',              color: '#5E5750',              bg: '#F1EEEA' },\n  played:      { label: 'Played',                dot: '#B8B8B8',              color: '#6B7280',              bg: '#F3F4F6' },\n  expired:     { label: 'Expired · unbooked',    dot: 'oklch(0.62 0.15 25)',  color: 'oklch(0.48 0.13 25)',  bg: 'oklch(0.95 0.03 25)' },\n};\nconst GIGS = [\n  { id: 'g1', dow: 'Fri', day: '2',  mon: 'Oct', time: '20:00–22:00', name: 'Friday Acoustic Session', sets: ['Maya Reid'], apps: 6, fresh: 0, priv: false, status: 'confirmed', week: 0 },\n  { id: 'g2', dow: 'Sat', day: '3',  mon: 'Oct', time: '19:30–23:00', name: 'Saturday Live', sets: ['The Lanterns', null], apps: 9, fresh: 1, priv: false, status: 'awaiting', week: 0 },\n  { id: 'g3', dow: 'Fri', day: '9',  mon: 'Oct', time: '20:00–22:00', name: 'Jazz Night', sets: [null], apps: 3, fresh: 2, priv: false, status: 'open', week: 1 },\n  { id: 'g4', dow: 'Sat', day: '10', mon: 'Oct', time: '21:00–23:00', name: 'Open Mic', sets: [null], apps: 1, fresh: 0, priv: true, status: 'negotiating', week: 1 },\n  { id: 'g5', dow: 'Fri', day: '16', mon: 'Oct', time: '19:00–21:00', name: 'Early Evening Set', sets: [null], apps: 0, fresh: 0, priv: false, status: 'open', week: 2 },\n  { id: 'g6', dow: 'Sat', day: '31', mon: 'Oct', time: '20:00–00:00', name: 'Halloween Party', sets: [null, null, null], apps: 2, fresh: 2, priv: true, status: 'open', week: 2 },\n];\nconst PAST = [\n  { id: 'p1', dow: 'Sat', day: '26', mon: 'Sep', time: '19:30–23:00', name: 'Saturday Live', sets: ['Northbound'], apps: 7, status: 'played' },\n  { id: 'p2', dow: 'Fri', day: '25', mon: 'Sep', time: '20:00–22:00', name: 'Friday Acoustic Session', sets: ['Maya Reid'], apps: 4, status: 'played' },\n  { id: 'p3', dow: 'Sat', day: '19', mon: 'Sep', time: '21:00–23:00', name: 'Open Mic', sets: [null], apps: 0, status: 'expired' },\n];\nconst WEEKS = [['This week', '28 Sep – 4 Oct'], ['Next week', '5 – 11 Oct'], ['Later in October', '12 – 31 Oct']];\nconst FACE_HUES = [35, 150, 260, 320, 80];\nconst needsAttention = (g) => g.fresh > 0 || g.status === 'awaiting' || g.status === 'negotiating';\n\nclass Component extends DCLogic {\n  state = { aTab: 'upcoming', bTile: 'all', sel: {}, bPast: false, copied: null };\n  copy(id) {\n    this.setState({ copied: id });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: null }), 1400);\n  }\n  enrich(g) {\n    const booked = g.sets.filter(Boolean).length;\n    const multi = g.sets.length > 1;\n    const setChips = g.sets.map((a, i) => ({\n      label: multi ? `Set ${i + 1} · ${a || 'Open'}` : (a || 'No artist yet'),\n      dot: a ? ST.confirmed.dot : '#D6D0C9',\n      color: a ? '#1F1B18' : '#7A716A',\n    }));\n    const confirmed = g.status === 'confirmed';\n    const copied = this.state.copied === g.id;\n    const priv = !!g.priv;\n    const share = {\n      show: !confirmed && g.status !== 'played' && g.status !== 'expired',\n      hide: confirmed || g.status === 'played' || g.status === 'expired',\n      isPriv: priv, isPublic: !priv,\n      label: copied ? 'Copied' : (priv ? 'Invite artists' : 'Copy gig link'),\n      short: copied ? 'Copied' : (priv ? 'Invite' : 'Copy link'),\n      note: confirmed ? `Booked · ${g.sets[0]}` : '',\n      onClick: (e) => { e.stopPropagation(); this.copy(g.id); },\n    };\n    const metaBits = [g.time];\n    if (multi) metaBits.push(`${g.sets.length} sets`);\n    metaBits.push(priv ? 'Invite only' : 'Public');\n    const faces = Array.from({ length: Math.min(g.apps, 3) }, (_, i) => {\n      const h = FACE_HUES[(g.id.charCodeAt(1) + i) % FACE_HUES.length];\n      return { i: ['JB', 'KS', 'RT', 'LM', 'OW'][(i + g.apps) % 5], bg: `oklch(0.92 0.05 ${h})`, fg: `oklch(0.42 0.1 ${h})` };\n    });\n    return {\n      ...g, multi, setChips, share, faces, st: ST[g.status],\n      meta: metaBits.join('  ·  '),\n      appsWord: g.apps === 1 ? 'application' : 'applications',\n      appsLine: g.apps === 0 ? 'No applications yet' : `${g.apps} applied`,\n      hasApps: g.apps > 0,\n      fresh: g.fresh > 0, freshLabel: `${g.fresh} new`,\n      dateShort: `${g.dow} ${g.day} ${g.mon}`,\n      dateMono: `${g.dow.toUpperCase()} ${g.day.padStart(2, '0')} ${g.mon.toUpperCase()}`,\n      setsCount: `${g.sets.length} sets`,\n      bookedLabel: `${booked}/${g.sets.length}`,\n      visibility: priv ? 'Invite only' : 'Public',\n      artist: g.sets[0] || 'Unbooked',\n      opacity: g.status === 'played' || g.status === 'expired' ? 0.72 : 1,\n    };\n  }\n  renderVals() {\n    const { aTab, bTile, sel, bPast } = this.state;\n    const showPast = this.props.showPast ?? false;\n    const all = GIGS.map(g => this.enrich(g));\n    const past = PAST.map(g => this.enrich(g));\n\n    // 1a\n    const counts = { upcoming: GIGS.length, attention: GIGS.filter(needsAttention).length, confirmed: GIGS.filter(g => g.status === 'confirmed').length, past: PAST.length };\n    const aTabs = [['upcoming', 'Upcoming'], ['attention', 'Needs attention'], ['confirmed', 'Confirmed'], ['past', 'Past']].map(([k, label]) => {\n      const on = aTab === k;\n      return { label, count: counts[k], weight: on ? 600 : 500, color: on ? '#1F1B18' : '#7A716A', line: on ? '#FF6C4B' : 'transparent',\n        countBg: k === 'attention' ? '#FFEDE7' : (on ? '#1F1B18' : '#F1ECE6'), countColor: k === 'attention' ? '#B5462C' : (on ? '#FFFFFF' : '#7A716A'),\n        onClick: () => this.setState({ aTab: k }) };\n    });\n    let aGroups;\n    if (aTab === 'past') aGroups = [{ title: 'September', range: '3 gigs', rows: past }];\n    else {\n      const list = all.filter(g => aTab === 'upcoming' || (aTab === 'attention' ? needsAttention(g) : g.status === 'confirmed'));\n      aGroups = WEEKS.map(([title, range], w) => ({ title, range, rows: list.filter(g => g.week === w) })).filter(x => x.rows.length);\n      if (showPast && aTab === 'upcoming') aGroups.push({ title: 'Past', range: 'September', rows: past });\n    }\n\n    // 1b\n    const tiles = [\n      ['all', 'All upcoming', GIGS.length, '#0F1115', () => true],\n      ['attention', 'Needs action', counts.attention, '#FF6C4B', needsAttention],\n      ['awaiting', 'Awaiting payment', GIGS.filter(g => g.status === 'awaiting').length, ST.awaiting.dot, g => g.status === 'awaiting'],\n      ['confirmed', 'Confirmed', counts.confirmed, ST.confirmed.dot, g => g.status === 'confirmed'],\n    ];\n    const tile = tiles.find(t => t[0] === bTile);\n    const bTiles = tiles.map(([k, label, count, dot]) => ({ label, count, dot, ring: bTile === k ? '0 0 0 1.5px #0F1115' : 'none', onClick: () => this.setState({ bTile: k }) }));\n    const bRows = all.filter(g => tile[4](g)).map(g => {\n      const s = !!sel[g.id];\n      return { ...g, selected: s, bg: s ? '#FFF7F4' : '#FFFFFF', cbBorder: s ? '#FF6C4B' : '#C9CDD4', cbBg: s ? '#FF6C4B' : '#FFFFFF',\n        onSelect: () => this.setState(st => ({ sel: { ...st.sel, [g.id]: !st.sel[g.id] } })) };\n    });\n    const nSel = Object.values(sel).filter(Boolean).length;\n\n    // 1c\n    const cols = [\n      ['open', 'Open for applications', ST.open.dot, 'Share the link or invite artists'],\n      ['negotiating', 'Negotiating', ST.negotiating.dot, 'Talking fees and details'],\n      ['awaiting', 'Awaiting payment', ST.awaiting.dot, 'Accepted, waiting on payment'],\n      ['confirmed', 'Confirmed', ST.confirmed.dot, 'Booked and paid'],\n    ];\n    const cCols = cols.map(([k, title, dot, hint]) => {\n      const cards = all.filter(g => g.status === k);\n      return { title, dot, hint, count: cards.length, cards };\n    });\n\n    return {\n      aTabs, aGroups, aEmpty: aGroups.length === 0,\n      bTiles, bRows, bPast: past, bShowPast: bPast || showPast, bPastRot: (bPast || showPast) ? 'rotate(90deg)' : 'none', pastCount: PAST.length,\n      bTogglePast: () => this.setState({ bPast: !bPast }),\n      bHasSel: nSel > 0, bSelLabel: `${nSel} selected`, bClearSel: () => this.setState({ sel: {} }),\n      cCols,\n      sideOpen: !this.state.sideCollapsed, sideClosed: !!this.state.sideCollapsed,\n      sideCols: this.state.sideCollapsed ? '68px' : '248px',\n      toggleSide: () => this.setState(s => ({ sideCollapsed: !s.sideCollapsed })),\n      stop: (e) => e.stopPropagation(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
